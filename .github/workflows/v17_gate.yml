name: V17 Gate

on:
  push:
    branches:
      - "jarvis-dev/20260916-JARVIS-V17-autonomous-options-runtime"
  pull_request:
    branches:
      - "**"

jobs:
  v17-regression:
    name: V17 regression (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package installation
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -e .

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Static parse
        run: python scripts/static_check.py

      - name: Runtime doctor
        run: python -m scripts.doctor --ci --json

      - name: V17 regression suite
        run: python -m unittest discover -s tests -p "test_v17_*.py" -v
