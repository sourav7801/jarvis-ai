name: V17 Gate

on:
  push:
    branches:
      - "jarvis-dev/20260916-JARVIS-V17-autonomous-options-runtime"
  pull_request:
    branches:
      - "**"

jobs:
  v17-regression:
    name: V17 regression (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package installation
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -e .

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply direct-pull V17 runtime guards
        run: |
          python scripts/apply_v17_release_patches.py
          python scripts/apply_v17_stability_patches.py
          python scripts/apply_v17_history_snapshot_patches.py
          python scripts/apply_v17_market_session_patches.py
          python scripts/apply_v17_crypto_paper_patches.py

      - name: Verify browser transport syntax
        run: |
          node --check workstation/quant_terminal_v2_static/v17_live_fetch_scheduler.js
          node --check workstation/quant_terminal_v2_static/v17_crypto_paper_runtime.js
          node --check workstation/quant_terminal_v2_static/v17_runtime.js
          node --check workstation/quant_terminal_v2_static/app.js
          node --check workstation/quant_terminal_v2_static/v16_workspace_router.js
          node --check workstation/quant_terminal_v2_static/v16_option_decision_runtime.js

      - name: Verify V17.4.1 unified data-plane invariants
        shell: pwsh
        run: |
          $app = Get-Content workstation/quant_terminal_v2_static/app.js -Raw
          $scheduler = Get-Content workstation/quant_terminal_v2_static/v17_live_fetch_scheduler.js -Raw
          $router = Get-Content workstation/quant_terminal_v2_static/v16_workspace_router.js -Raw
          if ($app -notmatch 'if\(candleActive<2\)') { throw 'Bounded chart-history concurrency missing' }
          if ($app -notmatch 'workspaceGeneration') { throw 'Workspace generation guard missing' }
          if ($app -notmatch 'workspaceAbortController') { throw 'Workspace cancellation missing' }
          if ($app -notmatch 'workspaceRuntimes=new Map') { throw 'Workspace chart preservation missing' }
          if ($app -notmatch 'MARKETS\.slice\(offset,offset\+2\)') { throw 'Staged watchlist hydration missing' }
          if ($app -notmatch 'liveTickBusy') { throw 'Non-overlapping live polling guard missing' }
          if ($scheduler -notmatch 'const limits = Object.freeze\(\{ live: 2, history: 2, module: 1 \}\)') { throw 'Unified data-plane limits missing' }
          if ($scheduler -notmatch '/api/v16/trading/workspace-state') { throw 'Canonical state dedupe missing' }
          if ($scheduler -notmatch '/api/candles') { throw 'History scheduling missing' }
          if ($scheduler -notmatch '/api/terminal/module') { throw 'Module scheduling missing' }
          if ($scheduler -notmatch 'REQUEST_SUPERSEDED') { throw 'Supersession contract missing' }
          if ($scheduler -notmatch 'writesIntercepted: false') { throw 'Read-only transport boundary missing' }
          if ($router -notmatch 'CHAIN_CACHE_MS = 15000') { throw 'OPTIONS chain cache missing' }
          if ($router -notmatch 'chainAbortController') { throw 'OPTIONS chain supersession missing' }
          if ($router -notmatch '\},10000\);') { throw 'Aggressive OPTIONS polling loop still present' }
          if ($app -notmatch 'display:"1"') { throw 'Display-history chart lane missing' }
          if ($app -notmatch 'params\.set\("fresh","1"\)') { throw 'Manual provider refresh bypass missing' }
          $displayHistory = Get-Content workstation/v17_display_history.py -Raw
          if ($displayHistory -notmatch 'DISPLAY ONLY') { throw 'Display-only history safety contract missing' }
          if ($displayHistory -notmatch '"execution_eligible": False') { throw 'Display cache execution hard-block missing' }

      - name: Verify canonical FYERS history invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from agents import fyers_data_adapter as adapter

          assert adapter._history_cache_path("NSE:NIFTY50-INDEX", "5", 220) == adapter._history_cache_path("NSE:NIFTY50-INDEX", "5", 500)
          assert adapter._history_cache_path("NSE:NIFTY50-INDEX", "5", 500) != adapter._history_cache_path("NSE:NIFTY50-INDEX", "15", 500)
          assert adapter._history_snapshot_bars(220) >= 500
          quant = Path("workstation/quant_terminal_v2.py").read_text(encoding="utf-8")
          assert '"provider_cache_stale": bool(payload.get("provider_cache_stale"))' in quant
          assert 'if provider_stale:' in quant
          assert '"available": False' in quant
          print("V17 canonical FYERS history identity and stale-evidence hard block verified.")
          '@ | python -

      - name: Verify venue-aware market-session routing
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from workstation.market_data_contract import VENUE_SESSIONS
          from workstation.paper_market_data import PAPER_MARKET_DATA

          assert VENUE_SESSIONS.venue_for(PAPER_MARKET_DATA.metadata("BTC")) == "CRYPTO_24_7"
          assert VENUE_SESSIONS.venue_for(PAPER_MARKET_DATA.metadata("CRUDEOIL")) == "MCX"
          assert VENUE_SESSIONS.venue_for(PAPER_MARKET_DATA.metadata("GOLD")) == "MCX"
          assert VENUE_SESSIONS.venue_for(PAPER_MARKET_DATA.metadata("NIFTY")) == "NSE"
          assert VENUE_SESSIONS.venue_for(PAPER_MARKET_DATA.metadata("SENSEX")) == "BSE"

          quant = Path("workstation/quant_terminal_v2.py").read_text(encoding="utf-8")
          app = Path("workstation/quant_terminal_v2_static/app.js").read_text(encoding="utf-8")
          assert 'PAPER_MARKET_DATA.session_open(canonical)' in quant
          assert 'snapshot_kind"] = "MARKET_CLOSED_STREAM_CACHE"' in quant
          assert 'payload.market_closed?"CLOSED"' in app
          print("V17 venue-aware routing verified: crypto 24/7, MCX independent, NSE/BSE independent.")
          '@ | python -

      - name: Verify canonical crypto PAPER invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from workstation.v17_crypto_paper_lane import ADAPTIVE_AUTHORITY, CRYPTO_PAPER_UNIVERSE, crypto_paper_lane

          assert CRYPTO_PAPER_UNIVERSE == ("BTC", "ETH", "SOL")
          status = crypto_paper_lane.status()
          assert status["canonical_paper_desk"] is True
          assert status["separate_crypto_ledger"] is False
          assert status["deribit_options_execution"] is False
          assert status["deribit_options_research_only"] is True
          assert status["paper_only"] is True
          assert status["live_execution"] is False
          assert status["qualification_authority"] == ADAPTIVE_AUTHORITY
          assert status["decision_authority"] == ADAPTIVE_AUTHORITY
          assert status["adaptive_policy_version"]
          http = Path("workstation/v17_terminal_http.py").read_text(encoding="utf-8")
          router = Path("workstation/quant_terminal_v2_static/v16_workspace_router.js").read_text(encoding="utf-8")
          crypto_ui = Path("workstation/quant_terminal_v2_static/v17_crypto_paper_runtime.js").read_text(encoding="utf-8")
          assert 'from workstation.v17_cross_market_control_plane import cross_market_control_plane' in http
          assert 'updates["armed"] = action == "start"' in http
          assert '"control_plane": control_plane' in http
          assert '"crypto_underlying_paper": crypto_status' in http
          assert 'BTC / ETH / SOL · UNDERLYING AUTO PAPER' in router
          assert 'UNDERLYING PAPER POSITION OPEN' in router
          assert 'OPEN CRYPTO PAPER POSITIONS' in crypto_ui
          print("V17 canonical BTC/ETH/SOL adaptive underlying PAPER lane and monitor verified; Deribit execution remains disabled.")
          '@ | python -

      - name: Static parse
        run: python scripts/static_check.py

      - name: Runtime doctor
        run: python -m scripts.doctor --ci --json

      - name: V17 regression suite
        run: python -m unittest discover -s tests -p "test_v17_*.py" -v
