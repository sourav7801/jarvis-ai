name: canonical-runtime

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate package installation
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-deps -e .

      - name: Static parse
        run: python scripts/static_check.py

      - name: Runtime doctor
        run: python -m scripts.doctor --ci --json

      - name: Unit and integration tests
        shell: pwsh
        run: |
          & python -m unittest discover -s tests -v *>&1 | Tee-Object -FilePath "unittest-${{ matrix.python-version }}.log"
          $exitCode = $LASTEXITCODE
          exit $exitCode

      - name: Upload unittest transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.python-version }}
          path: unittest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 3
